services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tootooroo_django
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./db.sqlite3:/root/workspace/src/tootooroo/db.sqlite3
      - ./mediafiles:/root/workspace/src/tootooroo/mediafiles
      - staticfiles:/root/workspace/src/tootooroo/staticfiles
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: tootooroo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mediafiles:/var/www/media:ro
      - staticfiles:/var/www/static:ro
    depends_on:
      - django

volumes:
  staticfiles:
